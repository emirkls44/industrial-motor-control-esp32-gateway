name: CI

on:
  push:
  pull_request:

jobs:
  unit-tests:
    name: Host unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run tests (ASan + UBSan)
        run: make -C tests

  firmware:
    name: ESP-IDF build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build (default menuconfig values)
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v6.1
          target: esp32
